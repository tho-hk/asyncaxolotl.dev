<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collision Presentation</title>
  <style>
    body {
      background-color: #2c3e50;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: grid;
      place-content: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
    }
    #game-board {
      position: relative;
      width: 600px;
      height: 400px;
      border: 2px solid #ecf0f1;
      background-color: #34495e;
    }
    #character {
      position: absolute;
      bottom: 10px;
      left: 50px;
      font-size: 2rem;
      transition: transform 0.2s;
      z-index: 10; /* Make sure character is on top */
    }
    #character.flipped {
      transform: scaleX(-1);
    }

    /* --- NEW STYLES --- */

    #trigger-zone {
      position: absolute;
      right: 30px;
      top: 100px;
      width: 100px;
      height: 100px;
      background-color: rgba(231, 76, 60, 0.2);
      border: 2px dashed rgba(231, 76, 60, 0.8);
      border-radius: 8px;
    }
    #trigger-zone.collided {
      background-color: rgba(46, 204, 113, 0.4);
      border-color: rgba(46, 204, 113, 1);
    }

    #slide-content {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #ecf0f1;
      color: #2c3e50;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none; /* Can't interact with it when hidden */
    }
    #slide-content.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div>
    <h1>Interactive Slideshow</h1>
    <p>Walk the character into the red box!</p>
    <div id="game-board">
      <div id="character">👨‍🚀</div>
      
      <!-- The trigger for our slide -->
      <div id="trigger-zone"></div>

      <!-- The "slide" content that is initially hidden -->
      <div id="slide-content">
        <h2>Mission Briefing!</h2>
        <p>Your objective is to explore the cosmos and present data in a fun, interactive way.</p>
      </div>
    </div>
  </div>

  <script>
    const character = document.getElementById('character');
    const triggerZone = document.getElementById('trigger-zone');
    const slideContent = document.getElementById('slide-content');

    let x = 50;
    let y = 10;
    const speed = 10;
    const pressedKeys = {};

    function gameLoop() {
      // --- Character Movement ---
      if (pressedKeys['ArrowLeft']) {
        x -= speed;
        character.classList.add('flipped');
      }
      if (pressedKeys['ArrowRight']) {
        x += speed;
        character.classList.remove('flipped');
      }
      if (pressedKeys['ArrowUp']) {
        y += speed;
      }
      if (pressedKeys['ArrowDown']) {
        y -= speed;
      }

      // Boundary detection
      if (x < 0) x = 0;
      if (x > 600 - 32) x = 600 - 32; // Character width approx 32px
      if (y < 0) y = 0;
      if (y > 400 - 40) y = 400 - 40; // Character height approx 40px

      character.style.left = x + 'px';
      character.style.bottom = y + 'px';

      // --- Collision Detection ---
      const charRect = character.getBoundingClientRect();
      const triggerRect = triggerZone.getBoundingClientRect();

      if (
        charRect.right > triggerRect.left &&
        charRect.left < triggerRect.right &&
        charRect.bottom > triggerRect.top &&
        charRect.top < triggerRect.bottom
      ) {
        // COLLISION!
        slideContent.classList.add('visible');
        triggerZone.classList.add('collided');
      } else {
        // NO COLLISION
        slideContent.classList.remove('visible');
        triggerZone.classList.remove('collided');
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => { pressedKeys[e.key] = true; });
    window.addEventListener('keyup', (e) => { delete pressedKeys[e.key]; });

    gameLoop(); // Start the loop
  </script>
</body>
</html>
