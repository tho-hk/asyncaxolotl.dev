<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Presentation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 id="header-scene-name">Interactive Slideshow</h1>
    <div class="header-info">
      <span id="header-player-level">Player Level: 1</span>
    </div>
  </header>

  <div class="app-container">
    <main>
      <div id="game-board">
        <div id="game-world">
          <div id="character"></div>
        </div>
      </div>
    </main>

    <aside>
      <h1>職涯求生！</h1>
      <p>職涯生存</p>
      <hr>
      <!-- Slide content for the Exploration scene -->
      <div id="slide-content" class="slide-panel">
        <h2>Mission Briefing!</h2>
        <p>Your objective is to explore the cosmos and present data in a fun, interactive way.</p>
      </div>
      <!-- Slide content for the Secret Base scene -->
      <div id="server-info-panel" class="slide-panel">
        <h2>Server Status</h2>
        <p>All systems are online. Data uplink is active.</p>
      </div>
    </aside>
  </div>

  <!-- All JS is now loaded from external files -->
  <script src="main.js" type="module"></script>
</body>

</html>
